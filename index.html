<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>슈크림빵 이벤트</title>

<style>

body{
    margin:0;
    padding:0;
    background:#fff8f0;
    font-family:Arial;
}

.container{
    width:90%;
    max-width:800px;
    margin:auto;
    padding:30px;
}

.title{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#5c3b1e;
    margin-top:20px;
}

.subtitle{
    text-align:center;
    font-size:26px;
    color:#e67e22;
    margin-top:20px;
}

.image{
    width:100%;
    margin-top:30px;
    border-radius:20px;
}

.content{
    margin-top:30px;
    font-size:22px;
    line-height:1.8;
    color:#333;
}

.buy-section{
    text-align:center;
    margin-top:50px;
}

.buy-button{
    background:#ff9800;
    color:white;
    border:none;
    padding:20px 50px;
    font-size:26px;
    border-radius:15px;
    cursor:pointer;
}

.buy-button:hover{
    background:#f57c00;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
고소하고 부드러운 슈크림빵
</div>

<div class="subtitle">
지금만! 5+1 이벤트 진행 중
</div>

<img class="image"
src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=1200&auto=format&fit=crop">

<div class="content">

겉은 부드럽고 속은 달콤한 크림으로 가득한 슈크림빵입니다.

촉촉한 빵과 진한 크림의 조합으로 많은 사람들에게 사랑받고 있습니다.

지금 구매하면 특별한 이벤트 혜택도 받을 수 있습니다.

한정 기간 동안 진행되는 프로모션을 놓치지 마세요.

</div>

<div class="buy-section">

<button class="buy-button">
지금 구매하기
</button>

</div>

</div>

</body>
</html>
